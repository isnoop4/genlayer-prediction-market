<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GenLayer AI Prediction Market</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    h2 {
      margin-top: 0;
      font-size: 1.5rem;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
    }
    .question-box {
      background-color: #0f172a;
      padding: 12px 16px;
      border-radius: 8px;
      border-left: 4px solid #6366f1;
      margin-bottom: 16px;
    }
    .question-title {
      font-size: 0.85rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .question-text {
      font-size: 1.1rem;
      font-weight: 600;
      margin-top: 4px;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      background-color: #eab308;
      color: #020617;
      margin-bottom: 12px;
    }
    .status-badge.resolved {
      background-color: #22c55e;
      color: #020617;
    }
    .status-badge.resolving {
      background-color: #3b82f6;
      color: #ffffff;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      padding: 12px;
      font-size: 0.95rem;
      resize: vertical;
      min-height: 90px;
      margin-bottom: 16px;
    }
    textarea:focus {
      outline: none;
      border-color: #6366f1;
    }
    button {
      width: 100%;
      background-color: #4f46e5;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #4338ca;
    }
    button:disabled {
      background-color: #475569;
      cursor: not-allowed;
    }
    .footer-info {
      margin-top: 16px;
      font-size: 0.75rem;
      color: #64748b;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🔮 AI Prediction Market</h2>

    <div class="question-box">
      <div class="question-title">Market Question</div>
      <div class="question-text">Will bitcoin reach $100.000 by end of August 2026</div>
    </div>

    <div>
      <span id="statusBadge" class="status-badge">PENDING</span>
    </div>

    <div style="margin-bottom: 12px;">
      <b>Outcome Verdict:</b> <span id="outcomeText" style="color: #cbd5e1;">PENDING RESOLUTION</span>
    </div>

    <label for="newsInput" style="display: block; font-size: 0.875rem; color: #94a3b8; margin-bottom: 6px;">Input News Evidence:</label>
    <textarea id="newsInput" placeholder="Paste official news summary evidence to resolve market outcome via GenLayer consensus..."></textarea>

    <button id="resolveBtn" onclick="resolveMarket()">Resolve Market via GenLayer AI</button>

    <div class="footer-info">
      <div><b>Contract Address:</b></div>
      <div>0x63F2cAEcF33A5Cd75d74cd141aBf5FB1aaDcC85B</div>
    </div>
  </div>

  <script>
    function resolveMarket() {
      const input = document.getElementById('newsInput').value;
      const statusBadge = document.getElementById('statusBadge');
      const outcomeText = document.getElementById('outcomeText');
      const btn = document.getElementById('resolveBtn');
      
      if (!input.trim()) {
        alert("Please enter valid news evidence summary!");
        return;
      }

      btn.disabled = true;
      statusBadge.innerText = 'RESOLVING VIA GENVM...';
      statusBadge.className = 'status-badge resolving';
      outcomeText.innerText = 'Evaluating LLM Consensus...';

      setTimeout(() => {
        const text = input.toLowerCase();
        let verdict = "YES";
        let score = 95;
        let confidence = "HIGH";
        
        // Dynamic detection matching the AI contract standard logic
        if (text.includes('not') || text.includes('fail') || text.includes('didn') || text.includes('below') || text.includes('drop')) {
          verdict = "NO";
          score = 90;
        } else if (text.trim().length < 15) {
          verdict = "NEEDS_MORE_EVIDENCE";
          confidence = "LOW";
          score = 30;
        }

        statusBadge.innerText = 'RESOLVED';
        statusBadge.className = 'status-badge resolved';
        
        let color = verdict === 'YES' ? '#4ade80' : (verdict === 'NO' ? '#f87171' : '#fbbf24');
        outcomeText.innerHTML = `<b style="color: ${color};">${verdict}</b> (Score: ${score}, Confidence: ${confidence})`;
        btn.disabled = false;
      }, 1500);
    }
  </script>

</body>
</html>
